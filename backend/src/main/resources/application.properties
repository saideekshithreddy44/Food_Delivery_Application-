# Server Configuration
server.port=8080

# Spring Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/food_delivery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Clever Cloud free tier allows max 5 connections)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
# Secret key encoded in Base64 (HMAC-SHA 512-bit key)
app.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVBbmRMb25nS2V5Rm9yRm9vZERlbGl2ZXJ5QXBwbGljYXRpb25KV1RUb2tlbjEyMzQ1Njc4OQ==
app.jwt.expiration-milliseconds=86400000
